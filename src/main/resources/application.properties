spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbgestor}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Observabilidad. En AWS, MANAGEMENT_SERVER_PORT=9091 separa estos endpoints en un puerto interno que solo ve Prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
